<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#18191d" />
  <meta name="description" content="Pratique lógica de programação em Python, no seu ritmo. Exercícios, testes e dicas sem cadastro." />
  <script>
    // Aplica a preferência antes da pintura inicial, inclusive em links diretos.
    (() => {
      let preference = 'system';
      try { preference = localStorage.getItem('codelearn:theme') || 'system'; } catch {}
      const dark = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>
  <title>Codelearn · Pratique Python</title>
</head>
<body>
  <a class="skip" href="#main">Pular para o conteúdo</a>
  <header class="topbar">
    <a class="brand" href="#"><span class="brand-icon">&lt;/&gt;</span> codelearn<span class="brand-dot">.</span></a>
    <nav aria-label="Principal"><a href="#" id="catalog-link">Exercícios</a><span class="language">Python 3 <span aria-hidden="true">●</span></span><label class="theme-control"><span>Tema</span><select id="theme" aria-label="Tema da interface"><option value="system">◐ Sistema</option><option value="light">☀ Claro</option><option value="dark">☾ Noturno</option></select></label></nav>
  </header>
  <div id="storage-warning" class="warning" role="alert" hidden>Não foi possível salvar os dados neste navegador. Você pode continuar praticando, mas seu progresso pode ser perdido ao sair.</div>
  <main id="main" tabindex="-1"></main>
  <footer>Feito para aprender, uma tentativa de cada vez.<span>Sem conta · Progresso salvo apenas neste navegador</span></footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
